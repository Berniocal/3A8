<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Množiny bodů – procvičování</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#f5f7fb;color:#18202a}
p{padding:24px;text-align:center}
</style>
</head>
<body>
<p>Načítám procvičování…</p>
<script>
(async()=>{
  const files=['mnoziny-ulohy-data-1.txt','mnoziny-ulohy-data-2.txt','mnoziny-ulohy-data-3.txt','mnoziny-ulohy-data-4.txt'];
  const parts=await Promise.all(files.map(async file=>{
    const response=await fetch(file,{cache:'no-store'});
    if(!response.ok) throw new Error(`Nelze načíst ${file}`);
    return (await response.text()).trim();
  }));
  const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
  if(!('DecompressionStream' in window)) throw new Error('Prohlížeč nepodporuje DecompressionStream.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();
  const patchCode="(() => {\n  const t12 = tasks.find(t => t.n === 12);\n  if (t12) t12.solution = `\n    <div class=\"answer-box\"><strong>Výsledek:</strong> dvě přímky rovnoběžné s \\\\(p\\\\), jedna na každé straně. Jejich vzdálenost od \\\\(p\\\\) získáme čistě konstrukčně z pomocného rovnoramenného trojúhelníku.</div>\n    <p>Sestrojíme pomocný trojúhelník \\\\(ASB\\\\) se stranami \\\\(|AS|=|BS|=2{,}5\\\\,\\\\mathrm{cm}\\\\) a \\\\(|AB|=3\\\\,\\\\mathrm{cm}\\\\). Trojúhelník tedy sestrojíme podle věty <strong>sss</strong>.</p>\n    <p>Úsečka \\\\(AB\\\\) představuje tětivu délky 3 cm a bod \\\\(S\\\\) střed kružnice o poloměru 2,5 cm. Z bodu \\\\(S\\\\) sestrojíme výšku \\\\(SM\\\\) na \\\\(AB\\\\).</p>\n    <p>Délka \\\\(SM\\\\) je právě hledaná vzdálenost středu kružnice od přímky \\\\(p\\\\). <strong>Nic nepočítáme.</strong> Délku \\\\(SM\\\\) přeneseme kružítkem na kolmici k \\\\(p\\\\) na obě strany a získanými body vedeme rovnoběžky s \\\\(p\\\\).</p>\n    <div class=\"construction\"><h4>Konstrukce</h4><ol>\n      <li>Sestroj pomocnou úsečku \\\\(AB=3\\\\,\\\\mathrm{cm}\\\\).</li>\n      <li>Sestroj kružnice \\\\(k(A;2{,}5\\\\,\\\\mathrm{cm})\\\\) a \\\\(l(B;2{,}5\\\\,\\\\mathrm{cm})\\\\). Jeden jejich průsečík označ \\\\(S\\\\).</li>\n      <li>Z bodu \\\\(S\\\\) spusť kolmici na \\\\(AB\\\\); pata kolmice je \\\\(M\\\\). Získáš délku \\\\(SM\\\\).</li>\n      <li>K dané přímce \\\\(p\\\\) sestroj kolmici a od jejího průsečíku s \\\\(p\\\\) přenes kružítkem délku \\\\(SM\\\\) na obě strany.</li>\n      <li>Oběma získanými body veď rovnoběžky s \\\\(p\\\\). Tyto dvě přímky jsou hledaná množina středů.</li>\n    </ol></div>`;\n\n  const t18 = tasks.find(t => t.n === 18);\n  if (t18) t18.solution = `\n    <div class=\"answer-box\"><strong>Výsledek:</strong> kružnice \\\\(l\\\\) se středem \\\\(S\\\\) a poloměrem rovným úhlopříčce čtverce o straně \\\\(1\\\\,\\\\mathrm{cm}\\\\).</div>\n    <p>Nechť se dvě tečny vedené z hledaného bodu \\\\(P\\\\) dotýkají kružnice v bodech \\\\(T_1,T_2\\\\).</p>\n    <p>Poloměr je v bodě dotyku kolmý na tečnu, takže \\\\(ST_1\\\\perp PT_1\\\\) a \\\\(ST_2\\\\perp PT_2\\\\). Podle zadání navíc \\\\(PT_1\\\\perp PT_2\\\\).</p>\n    <p>Čtyřúhelník \\\\(ST_1PT_2\\\\) má tedy tři pravé úhly, a proto i čtvrtý. Je to obdélník. Současně \\\\(|ST_1|=|ST_2|=1\\\\,\\\\mathrm{cm}\\\\), protože jde o poloměry dané kružnice. Obdélník se dvěma sousedními stejně dlouhými stranami je <strong>čtverec</strong>.</p>\n    <p>Body \\\\(S\\\\) a \\\\(P\\\\) jsou protější vrcholy tohoto čtverce. Vzdálenost \\\\(SP\\\\) je tedy vždy stejná: je to úhlopříčka čtverce o straně 1 cm.</p>\n    <p>Číselnou hodnotu úhlopříčky vůbec nepotřebujeme. Sestrojíme jeden pomocný čtverec a jeho úhlopříčku použijeme jako poloměr hledané kružnice.</p>\n    <div class=\"construction\"><h4>Konstrukce</h4><ol>\n      <li>Zvol na kružnici \\\\(k\\\\) bod \\\\(T_1\\\\) a narýsuj poloměr \\\\(ST_1\\\\).</li>\n      <li>V bodě \\\\(S\\\\) sestroj kolmici k \\\\(ST_1\\\\). Její průsečík s kružnicí \\\\(k\\\\) označ \\\\(T_2\\\\).</li>\n      <li>Doplň čtverec \\\\(ST_1P_0T_2\\\\). Bod \\\\(P_0\\\\) je vrchol protější k \\\\(S\\\\).</li>\n      <li>Kružítkem vezmi délku \\\\(SP_0\\\\).</li>\n      <li>Sestroj kružnici \\\\(l(S;SP_0)\\\\). Ta je hledanou množinou všech bodů \\\\(P\\\\).</li>\n    </ol></div>`;\n\n  const originalTaskDiagram = taskDiagram;\n  taskDiagram = function(n){\n    const pt=(x,y,c=\"point\",r=5)=>`<circle class=\"${c}\" cx=\"${x}\" cy=\"${y}\" r=\"${r}\"/>`;\n    const label=(x,y,t,cls=\"\")=>`<text x=\"${x}\" y=\"${y}\" class=\"${cls}\">${t}</text>`;\n    const step=(i,body)=>`<g class=\"diagram-step\" data-step=\"${i}\">${body}</g>`;\n\n    if(n===12) return svgWrap(`\n      ${step(1,`${label(66,28,\"Pomocná konstrukce podle sss\",\"blue-label\")}<line class=\"given\" x1=\"90\" y1=\"130\" x2=\"210\" y2=\"130\"/>${pt(90,130)}${pt(210,130)}${label(74,153,\"A\")}${label(216,153,\"B\")}${label(124,157,\"3 cm\",\"small\")}`)}\n      ${step(2,`<circle class=\"helper\" cx=\"90\" cy=\"130\" r=\"100\"/><circle class=\"helper\" cx=\"210\" cy=\"130\" r=\"100\"/>${pt(150,50,\"point-blue\",6)}${label(159,43,\"S\",\"blue-label\")}<line class=\"given\" x1=\"90\" y1=\"130\" x2=\"150\" y2=\"50\"/><line class=\"given\" x1=\"210\" y1=\"130\" x2=\"150\" y2=\"50\"/>${label(96,79,\"2,5 cm\",\"small\")}${label(176,79,\"2,5 cm\",\"small\")}`)}\n      ${step(3,`<line class=\"helper\" x1=\"150\" y1=\"50\" x2=\"150\" y2=\"130\"/>${pt(150,130)}${label(158,146,\"M\",\"small\")}<path class=\"thin\" d=\"M140 120 h10 v10\"/>${label(164,95,\"SM\",\"blue-label\")}`)}\n      ${step(4,`${label(350,28,\"Přenesení délky SM k přímce p\",\"blue-label\")}<line class=\"given\" x1=\"335\" y1=\"165\" x2=\"585\" y2=\"165\"/>${label(562,153,\"p\")}<line class=\"helper\" x1=\"455\" y1=\"65\" x2=\"455\" y2=\"265\"/><path class=\"thin\" d=\"M445 155 h10 v10\"/>${pt(455,165)}${pt(455,85,\"point-blue\",5)}${pt(455,245,\"point-blue\",5)}${label(468,89,\"SM\",\"small\")}${label(468,249,\"SM\",\"small\")}`)}\n      ${step(5,`<line class=\"locus\" x1=\"335\" y1=\"85\" x2=\"585\" y2=\"85\"/><line class=\"locus\" x1=\"335\" y1=\"245\" x2=\"585\" y2=\"245\"/>${label(344,72,\"hledaná množina\",\"blue-label\")}${label(344,274,\"hledaná množina\",\"blue-label\")}`)}\n    `);\n\n    if(n===17) return svgWrap(`\n      ${step(1,`${pt(230,160)}${label(210,184,\"S\")}<circle class=\"given\" cx=\"230\" cy=\"160\" r=\"120\"/>${pt(440,160)}${label(450,184,\"A\")}<line class=\"helper\" x1=\"230\" y1=\"160\" x2=\"440\" y2=\"160\"/>`)}\n      ${step(2,`<circle class=\"helper\" cx=\"335\" cy=\"160\" r=\"105\"/>${label(450,78,\"Thaletova kružnice\",\"small\")}${label(450,100,\"průměr SA\",\"small\")}`)}\n      ${step(3,`${pt(298.57,61.52,\"open-point\",7)}${pt(298.57,258.48,\"open-point\",7)}${label(308,58,\"T₁\",\"small\")}${label(308,280,\"T₂\",\"small\")}`)}\n      ${step(4,`<path class=\"locus\" d=\"M298.57 61.52 A105 105 0 0 0 298.57 258.48\"/>${label(86,36,\"modrý oblouk uvnitř k = středy tětiv\",\"blue-label\")}${pt(230,160,\"point-blue\",6)}${label(238,151,\"S patří do množiny\",\"small\")}`)}\n    `);\n\n    if(n===18) return svgWrap(`\n      ${step(1,`${pt(245,160)}${label(225,184,\"S\")}<circle class=\"given\" cx=\"245\" cy=\"160\" r=\"75\"/>${pt(320,160)}${label(326,180,\"T₁\",\"small\")}<line class=\"given\" x1=\"245\" y1=\"160\" x2=\"320\" y2=\"160\"/>${label(270,149,\"1 cm\",\"small\")}`)}\n      ${step(2,`<line class=\"helper\" x1=\"245\" y1=\"55\" x2=\"245\" y2=\"265\"/>${pt(245,85)}${label(222,78,\"T₂\",\"small\")}<line class=\"given\" x1=\"245\" y1=\"160\" x2=\"245\" y2=\"85\"/>${label(253,120,\"1 cm\",\"small\")}<path class=\"thin\" d=\"M245 145 h15 v15\"/>`)}\n      ${step(3,`<line class=\"given\" x1=\"320\" y1=\"160\" x2=\"320\" y2=\"85\"/><line class=\"given\" x1=\"245\" y1=\"85\" x2=\"320\" y2=\"85\"/>${pt(320,85,\"point-blue\",6)}${label(329,80,\"P₀\",\"blue-label\")}<line class=\"helper\" x1=\"245\" y1=\"160\" x2=\"320\" y2=\"85\"/>${label(274,111,\"SP₀\",\"blue-label\")}${label(353,112,\"pomocný čtverec\",\"small\")}${label(353,133,\"o straně 1 cm\",\"small\")}`)}\n      ${step(4,`<circle class=\"locus\" cx=\"245\" cy=\"160\" r=\"106.066\"/>${label(58,30,\"hledaná množina: l(S; SP₀)\",\"blue-label\")}${label(58,54,\"poloměr je úhlopříčka pomocného čtverce\",\"small\")}`)}\n      ${step(5,`<path class=\"thin\" d=\"M305 85 v15 h15\"/>${label(336,97,\"tečny jsou kolmé\",\"small\")}`)}\n    `);\n\n    return originalTaskDiagram(n);\n  };\n\n  render();\n})();";
  const patchHtml='<scr'+'ipt>'+patchCode+'</scr'+'ipt>';
  html=html.replace('</body>', patchHtml+'\n</body>');
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<p>Nepodařilo se načíst procvičování. Zkus stránku obnovit nebo použít novější prohlížeč.</p>';
  console.error(err);
});
</script>
</body>
</html>
