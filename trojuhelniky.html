<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas konstrukcí trojúhelníku</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#fff; --ink:#172033; --muted:#64748b; --line:#dbe2ea;
  --accent:#315efb; --soft:#eef3ff; --good:#137a43; --warn:#a85b00; --bad:#b42318;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:330px 1fr}
aside{background:#0f172a;color:white;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:22px;font-weight:800;line-height:1.15;margin-bottom:6px}
.brand small{display:block;color:#cbd5e1;font-size:13px;font-weight:500;margin-top:7px;line-height:1.45}
.search{width:100%;margin:16px 0 10px;border:0;border-radius:11px;padding:11px 12px;background:#1e293b;color:white;outline:none}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{border:1px solid #334155;background:#172033;color:#cbd5e1;border-radius:999px;padding:6px 9px;cursor:pointer;font-size:12px}
.filters button.active{background:white;color:#0f172a;border-color:white}
.problem-list{display:grid;gap:6px}
.problem-item{width:100%;text-align:left;border:0;background:transparent;color:#dbeafe;padding:9px 10px;border-radius:9px;cursor:pointer}
.problem-item:hover{background:#1e293b}
.problem-item.active{background:#315efb;color:#fff}
.problem-item b{display:block;font-size:14px}
.problem-item span{font-size:12px;color:#94a3b8}
.problem-item.active span{color:#dbeafe}
main{padding:28px;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:18px}
.navbtn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px;cursor:pointer}
.progress{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:minmax(360px,1fr) minmax(420px,1.15fr);gap:20px;align-items:start}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 18px rgba(15,23,42,.04)}
.eyebrow{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
h1{font-size:30px;line-height:1.15;margin:6px 0 10px}
.lead{color:var(--muted);line-height:1.6;margin:0 0 16px}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px}
.badge{background:var(--soft);color:#2448bd;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}
.kv{display:grid;grid-template-columns:135px 1fr;gap:8px 12px;margin:12px 0}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0}
.notice{border-left:4px solid var(--accent);background:#f8faff;padding:12px 14px;border-radius:10px;line-height:1.55;margin:15px 0}
.notice.warn{border-color:#e99800;background:#fff8e8}
.solution-toggle{width:100%;border:0;background:#137a43;color:white;padding:12px 14px;border-radius:11px;font-weight:800;cursor:pointer;margin-top:8px}
.solution{display:none;margin-top:16px}
.solution.open{display:block}
.steps{display:grid;gap:9px;margin-top:10px}
.step{border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer}
.step.active{border-color:#8ca6ff;background:#f7f9ff}
.step .num{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#e9efff;color:#2448bd;font-weight:800;font-size:12px;margin-right:8px}
.step strong{font-size:14px}
.step p{margin:7px 0 0 33px;color:#475569;font-size:14px;line-height:1.5}
.construction{margin-top:15px;padding:14px;background:#f8fafc;border-radius:11px;border:1px solid var(--line)}
.construction h3{margin:0 0 8px;font-size:15px}
.construction ol{margin:0;padding-left:22px;line-height:1.62;color:#334155}
.diagram-card{position:sticky;top:20px}
.diagram-head{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.diagram-title{font-size:16px;font-weight:800}
.step-counter{font-size:13px;color:var(--muted)}
svg{width:100%;height:auto;aspect-ratio:4/3;background:linear-gradient(180deg,#fff,#fbfdff);border:1px solid var(--line);border-radius:14px}
.diagram-controls{display:flex;gap:8px;margin-top:10px}
.diagram-controls button{flex:1;border:1px solid var(--line);background:white;border-radius:10px;padding:9px;cursor:pointer}
.diagram-controls button.primary{background:var(--accent);border-color:var(--accent);color:white}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:18px;border-top:3px solid;margin-right:5px;vertical-align:middle}
.l-given{border-color:#172033!important}.l-help{border-color:#e99800!important}.l-final{border-color:#137a43!important}
.teacher-note{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;color:#475569;line-height:1.55;font-size:14px}
sub{font-size:.72em;line-height:0;vertical-align:sub}
.sketchbox{margin-top:14px}
.sketchbox h3{margin:0 0 8px;font-size:15px}
.sketchbox p{margin:8px 0 0;color:#475569;line-height:1.5;font-size:14px}
.sketch-preview svg{aspect-ratio:16/10;max-height:290px}

.home{max-width:980px;margin:auto}
.home h1{font-size:38px}
.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}
.stat b{display:block;font-size:26px}
.stat span{color:var(--muted);font-size:13px}
@media(max-width:1000px){
 .app{grid-template-columns:1fr}
 aside{position:relative;height:auto}
 .grid{grid-template-columns:1fr}
 .diagram-card{position:relative;top:auto}
}
@media(max-width:600px){
 main{padding:16px}
 .catalog{grid-template-columns:1fr}
 h1{font-size:25px}
 .kv{grid-template-columns:1fr}
}

/* ===== Mobilní režim: seznam -> detail úlohy ===== */
.mobile-floating-nav{display:none}

@media(max-width:700px){
  body{background:#f3f6fb}
  body.mobile-detail{padding-bottom:84px}

  .app{display:block;min-height:100vh}

  aside{
    position:relative;
    width:100%;
    height:auto;
    min-height:100vh;
    padding:18px 14px 28px;
    background:#0f172a;
  }
  .brand{
    font-size:21px;
    padding:4px 4px 2px;
  }
  .brand small{font-size:12.5px;max-width:34em}
  .search{
    position:sticky;
    top:8px;
    z-index:4;
    margin:14px 0 10px;
    box-shadow:0 8px 24px rgba(15,23,42,.25);
  }
  .filters{
    flex-wrap:nowrap;
    overflow-x:auto;
    padding:1px 1px 8px;
    margin-right:-14px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none}
  .filters button{
    flex:0 0 auto;
    min-height:34px;
  }
  .problem-list{gap:8px}
  .problem-item{
    background:#172033;
    border:1px solid #29364b;
    border-radius:13px;
    padding:12px 13px;
    min-height:62px;
  }
  .problem-item:hover{background:#1e293b}
  .problem-item.active{background:#172033;border-color:#3b4c66}
  .problem-item b{font-size:15px;line-height:1.28}
  .problem-item span{display:block;margin-top:5px;font-size:12px}

  main{display:none;padding:0}

  body.mobile-detail aside{display:none}
  body.mobile-detail main{
    display:block;
    min-height:100vh;
    padding:12px 12px 24px;
  }
  body.mobile-detail .topbar{display:none}

  .mobile-detail-wrap{
    max-width:680px;
    margin:0 auto;
  }
  .mobile-detail-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:17px;
    padding:16px 14px;
    box-shadow:0 4px 18px rgba(15,23,42,.05);
  }
  .mobile-detail-card h1{
    margin:5px 0 8px;
    font-size:25px;
    line-height:1.17;
  }
  .mobile-detail-card .lead{
    margin-bottom:12px;
    font-size:14px;
  }
  .mobile-detail-card .badges{
    margin:10px 0 13px;
  }
  .mobile-assignment{
    display:grid;
    gap:10px;
    padding:13px;
    border:1px solid var(--line);
    border-radius:13px;
    background:#f8fafc;
  }
  .mobile-assignment-row{
    display:grid;
    grid-template-columns:72px 1fr;
    gap:9px;
    align-items:start;
    font-size:14px;
    line-height:1.45;
  }
  .mobile-assignment-row > span{
    color:var(--muted);
    font-weight:800;
  }
  .mobile-detail-card .notice{
    margin:12px 0 14px;
    font-size:14px;
  }

  .mobile-accordions{
    display:grid;
    gap:9px;
    margin-top:12px;
  }
  .mobile-accordion{
    border:1px solid var(--line);
    border-radius:13px;
    overflow:hidden;
    background:#fff;
  }
  .mobile-accordion-toggle{
    width:100%;
    border:0;
    background:#fff;
    color:var(--ink);
    padding:14px 13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    text-align:left;
    font-weight:850;
    cursor:pointer;
  }
  .mobile-accordion-toggle:active{background:#f8fafc}
  .mobile-accordion-toggle .left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mobile-accordion-toggle .icon{
    width:31px;height:31px;
    display:grid;place-items:center;
    border-radius:9px;
    background:var(--soft);
    color:#2448bd;
    font-size:16px;
  }
  .mobile-accordion-toggle .chev{
    font-size:20px;
    color:#64748b;
    transform:rotate(0deg);
    transition:transform .18s ease;
  }
  .mobile-accordion.open .mobile-accordion-toggle .chev{
    transform:rotate(180deg);
  }
  .mobile-accordion-panel{
    display:none;
    border-top:1px solid var(--line);
    padding:12px;
    background:#fbfcfe;
  }
  .mobile-accordion.open .mobile-accordion-panel{display:block}

  .mobile-sketch-note{
    margin:9px 2px 2px;
    color:#475569;
    line-height:1.5;
    font-size:13px;
  }
  .mobile-sketch svg{
    aspect-ratio:4/3;
    max-height:none;
  }

  .mobile-procedure-diagram{
    background:white;
    border:1px solid var(--line);
    border-radius:13px;
    padding:9px;
    margin-bottom:10px;
  }
  .mobile-procedure-diagram .diagram-head{
    margin:0 2px 8px;
  }
  .mobile-procedure-diagram svg{border-radius:10px}
  .mobile-procedure-diagram .diagram-controls{
    margin-top:8px;
  }
  .mobile-procedure-diagram .diagram-controls button{
    min-height:42px;
    padding:8px 6px;
    font-size:13px;
  }
  .mobile-procedure-diagram .legend{
    gap:8px;
    margin:8px 2px 0;
    font-size:11px;
  }

  .mobile-steps{
    display:grid;
    gap:7px;
  }
  .mobile-steps .step{
    background:#fff;
    padding:10px;
  }
  .mobile-steps .step p{
    margin-left:33px;
    font-size:13px;
  }

  .mobile-construction{
    margin:0;
    border:0;
    background:transparent;
    padding:2px 4px;
  }
  .mobile-construction ol{
    margin:0;
    padding-left:23px;
    line-height:1.75;
    font-size:14px;
  }

  .mobile-floating-nav{
    display:none;
    position:fixed;
    z-index:50;
    left:8px;
    right:8px;
    bottom:calc(8px + env(safe-area-inset-bottom));
    grid-template-columns:.92fr 1fr 1fr;
    gap:7px;
    padding:7px;
    border:1px solid rgba(203,213,225,.88);
    border-radius:16px;
    background:rgba(255,255,255,.94);
    box-shadow:0 12px 35px rgba(15,23,42,.22);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }
  body.mobile-detail .mobile-floating-nav{display:grid}
  .mobile-floating-nav button{
    min-width:0;
    min-height:48px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#fff;
    color:var(--ink);
    padding:7px 5px;
    font-weight:800;
    font-size:12px;
    line-height:1.15;
    cursor:pointer;
  }
  .mobile-floating-nav button.mobile-next{
    border-color:var(--accent);
    background:var(--accent);
    color:#fff;
  }
  .mobile-floating-nav .nav-symbol{
    display:block;
    font-size:17px;
    line-height:1;
    margin-bottom:3px;
  }
}

@media(min-width:701px){
  body.mobile-detail .mobile-floating-nav{display:none!important}
}

@media print{
 aside,.topbar,.diagram-controls,.solution-toggle{display:none!important}
 .app{display:block}.grid{grid-template-columns:1fr}.card{box-shadow:none;break-inside:avoid}.solution{display:block}
 .diagram-card{position:relative;top:auto}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">△ Atlas konstrukcí
    <small>Trojúhelníky krok po kroku: zápis konstrukce + grafické řešení.</small>
  </div>
  <input id="search" class="search" placeholder="Hledat: těžnice, výška, R, r…">
  <div id="filters" class="filters"></div>
  <div id="problemList" class="problem-list"></div>
</aside>

<main>
  <div class="topbar">
    <button class="navbtn" id="prevProblem">← Předchozí</button>
    <div class="progress" id="progress"></div>
    <button class="navbtn" id="nextProblem">Další →</button>
  </div>
  <div id="content"></div>
</main>

<div id="mobileFloatingNav" class="mobile-floating-nav" aria-label="Navigace mezi příklady">
  <button id="mobileBackToList"><span class="nav-symbol">↩</span>Zpět</button>
  <button id="mobilePrevProblem"><span class="nav-symbol">←</span>Předchozí</button>
  <button id="mobileNextProblem" class="mobile-next"><span class="nav-symbol">→</span>Další příklad</button>
</div>
</div>

const cats = ["Vše", ...new Set(P.map(x=>x.cat))];
let current = 0, filter = "Vše", query = "", stepIndex = 0, openSolution = false;
let mobileDetail = false;
let mobilePanels = {sketch:false, steps:false, construction:false};

function isMobileLayout(){
 return window.matchMedia("(max-width:700px)").matches;
}
function resetMobilePanels(){
 mobilePanels = {sketch:false, steps:false, construction:false};
}
function syncMobileBody(){
 document.body.classList.toggle("mobile-detail", isMobileLayout() && mobileDetail);
}

const $ = s => document.querySelector(s);
const el = (name, attrs={}) => {
  const n=document.createElement(name);
  Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));
  return n;
};

function filtered(){
 return P.map((p,i)=>({...p,_i:i})).filter(p=>{
   const okCat = filter==="Vše" || p.cat===filter;
   const hay=(p.title+" "+p.given+" "+p.tags.join(" ")+" "+p.cat).toLowerCase();
   return okCat && hay.includes(query.toLowerCase());
 });
}
function renderFilters(){
 $("#filters").innerHTML="";
 cats.forEach(c=>{
   const b=el("button"); b.textContent=c; if(c===filter)b.classList.add("active");
   b.onclick=()=>{filter=c;renderFilters();renderList();};
   $("#filters").appendChild(b);
 });
}
function renderList(){
 const list=$("#problemList"); list.innerHTML="";
 const arr=filtered();
 arr.forEach(p=>{
   const b=el("button",{class:"problem-item"+(p._i===current && !isMobileLayout()?" active":"")});
   b.innerHTML=`<b>${p.title}</b><span>${p.cat}</span>`;
   b.onclick=()=>{
     current=p._i;
     stepIndex=0;
     openSolution=false;
     if(isMobileLayout()){
       mobileDetail=true;
       resetMobilePanels();
     }
     syncMobileBody();
     renderAll();
     scrollTo({top:0,behavior:"smooth"});
   };
   list.appendChild(b);
 });
 if(!arr.length) list.innerHTML='<div style="color:#94a3b8;padding:10px">Nic nenalezeno.</div>';
}

function desktopDetailTemplate(p){
 return `
 <div class="grid">
  <section class="card">
   <div class="eyebrow">${p.cat}</div>
   <h1>${p.title}</h1>
   <p class="lead">${p.find}</p>
   <div class="badges">${p.tags.map(t=>`<span class="badge">${t}</span>`).join("")}</div>
   <dl class="kv">
    <dt>Zadáno</dt><dd><b>${p.given}</b></dd>
    <dt>Úkol</dt><dd>${p.find}</dd>
    <dt>Varianty</dt><dd>${p.variants}</dd>
   </dl>
   <div class="notice"><b>Podmínka / počet řešení:</b><br>${p.existence}</div>
   <div class="construction sketchbox">
     <h3>Náčrtek situace</h3>
     <div class="sketch-preview">${drawSketch(p)}</div>
     <p>Tohle je rychlý orientační náčrtek celé úlohy. <b>Zeleně</b> jsou vyznačené zadané (známé) údaje, <b>černě</b> nezadané části trojúhelníku a <b>oranžově</b> pomocné konstrukce. Přesný postup po jednotlivých krocích je vpravo v části <b>Grafické řešení krok po kroku</b>.</p>
   </div>
   <button id="solutionToggle" class="solution-toggle">${openSolution?"Skrýt řešení":"Rozbalit kompletní řešení"}</button>
   <div id="solution" class="solution ${openSolution?"open":""}">
     <div class="steps">${p.steps.map((s,i)=>`
       <div class="step ${i===stepIndex?"active":""}" data-step="${i}">
        <span class="num">${i+1}</span><strong>${s[0]}</strong>
        <p>${s[1]}</p>
       </div>`).join("")}
     </div>
     <div class="construction">
       <h3>Zápis konstrukce</h3>
       <ol>${p.construction.map(x=>`<li>${x}</li>`).join("")}</ol>
     </div>
     <div class="teacher-note"><b>Jak to číst:</b> oranžové čáry jsou pomocné konstrukce, tmavé části jsou zadané a zeleně se zvýrazní výsledný trojúhelník. Kliknutím na kterýkoli krok se obrázek přepne přesně do dané fáze.</div>
   </div>
  </section>
  <section class="card diagram-card">
    <div class="diagram-head"><span class="diagram-title">Grafické řešení krok po kroku</span><span class="step-counter">Krok ${stepIndex+1} z ${p.steps.length}</span></div>
    <div id="svgWrap"></div>
    <div class="diagram-controls">
      <button id="prevStep">← Krok zpět</button>
      <button class="primary" id="nextStep">Další krok →</button>
    </div>
    <div class="legend">
      <span><i class="l-given"></i>zadané</span>
      <span><i class="l-help"></i>pomocné</span>
      <span><i class="l-final"></i>výsledek</span>
    </div>
  </section>
 </div>`;
}

function bindDesktopDetail(p){
 const toggle=$("#solutionToggle");
 if(toggle) toggle.onclick=()=>{openSolution=!openSolution;renderAll();};

 document.querySelectorAll(".step").forEach(n=>n.onclick=()=>{
   stepIndex=+n.dataset.step;
   openSolution=true;
   renderAll();
 });

 const prev=$("#prevStep"), next=$("#nextStep");
 if(prev) prev.onclick=()=>{stepIndex=Math.max(0,stepIndex-1);openSolution=true;renderAll();};
 if(next) next.onclick=()=>{stepIndex=Math.min(p.steps.length-1,stepIndex+1);openSolution=true;renderAll();};

 const wrap=$("#svgWrap");
 if(wrap) wrap.innerHTML=draw(p,stepIndex);
}

function bindMobileDetail(p){
 document.querySelectorAll("[data-mobile-toggle]").forEach(btn=>{
   btn.onclick=()=>{
     const key=btn.dataset.mobileToggle;
     mobilePanels[key]=!mobilePanels[key];
     renderAll();
   };
 });

 document.querySelectorAll("[data-mobile-step]").forEach(n=>{
   n.onclick=()=>{
     stepIndex=+n.dataset.mobileStep;
     mobilePanels.steps=true;
     renderAll();
     const acc=document.querySelector('[data-mobile-accordion="steps"]');
     if(acc) acc.scrollIntoView({behavior:"smooth",block:"start"});
   };
 });

 const prev=$("#mobilePrevStep"), next=$("#mobileNextStep");
 if(prev) prev.onclick=()=>{
   stepIndex=Math.max(0,stepIndex-1);
   mobilePanels.steps=true;
   renderAll();
 };
 if(next) next.onclick=()=>{
   stepIndex=Math.min(p.steps.length-1,stepIndex+1);
   mobilePanels.steps=true;
   renderAll();
 };
}

function renderAll(){
 syncMobileBody();
 renderList();

 const p=P[current];
 const progress=$("#progress");
 if(progress) progress.textContent=`${current+1} / ${P.length}`;

 if(isMobileLayout()){
   if(!mobileDetail){
     $("#content").innerHTML="";
     return;
   }
   $("#content").innerHTML=mobileDetailTemplate(p);
   bindMobileDetail(p);
   return;
 }

 $("#content").innerHTML=desktopDetailTemplate(p);
 bindDesktopDetail(p);
}

function moveProblem(delta){
 current=(current+delta+P.length)%P.length;
 stepIndex=0;
 openSolution=false;
 resetMobilePanels();
 renderAll();
 scrollTo({top:0,behavior:"smooth"});
}

$("#prevProblem").onclick=()=>moveProblem(-1);
$("#nextProblem").onclick=()=>moveProblem(1);

$("#mobileBackToList").onclick=()=>{
 mobileDetail=false;
 resetMobilePanels();
 syncMobileBody();
 renderAll();
 scrollTo({top:0,behavior:"smooth"});
};
$("#mobilePrevProblem").onclick=()=>moveProblem(-1);
$("#mobileNextProblem").onclick=()=>moveProblem(1);

$("#search").addEventListener("input",e=>{query=e.target.value;renderList();});

window.addEventListener("resize",()=>{
 syncMobileBody();
 if(!isMobileLayout()){
   renderAll();
 }else if(!mobileDetail){
   renderList();
 }
});

const W=800,H=600;
const fmt=n=>Number(n).toFixed(1);
function svg(parts){return `<svg viewBox="0 0 ${W} ${H}" role="img">${parts.join("")}</svg>`}
function line(a,b,cls="help",dash=false){return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${cls==="final"?"#137a43":cls==="given"?"#172033":"#e99800"}" stroke-width="${cls==="final"?5:3}" ${dash?'stroke-dasharray="9 8"':""} stroke-linecap="round"/>`}
function circle(c,r,cls="help",dash=false){return `<circle cx="${c.x}" cy="${c.y}" r="${r}" fill="none" stroke="${cls==="final"?"#137a43":cls==="given"?"#172033":"#e99800"}" stroke-width="3" ${dash?'stroke-dasharray="9 8"':""}/>`}
function pt(p,name,cls="given"){return `<circle cx="${p.x}" cy="${p.y}" r="6" fill="${cls==="final"?"#137a43":"#172033"}"/><text x="${p.x+10}" y="${p.y-10}" font-size="22" font-weight="800" fill="#172033">${name}</text>`}
function txt(x,y,t,anchor="start"){return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="18" fill="#64748b">${t}</text>`}
function arcPath(cx,cy,r,a1,a2,cls="help"){
 const p1={x:cx+r*Math.cos(a1),y:cy+r*Math.sin(a1)}, p2={x:cx+r*Math.cos(a2),y:cy+r*Math.sin(a2)};
 const large=Math.abs(a2-a1)>Math.PI?1:0;
 return `<path d="M ${p1.x} ${p1.y} A ${r} ${r} 0 ${large} 1 ${p2.x} ${p2.y}" fill="none" stroke="${cls==="final"?"#137a43":cls==="given"?"#172033":"#e99800"}" stroke-width="3"/>`
}
function mapPoint(x,y){return {x:120+x*85,y:500-y*85}}
function baseSetup(a=6){return {B:mapPoint(0,0),C:mapPoint(a,0),M:mapPoint(a/2,0)}}
function intersectCircleHorizontal(cx,cy,r,y){
 const dy=y-cy, dx=Math.sqrt(Math.max(0,r*r-dy*dy)); return [cx-dx,cx+dx];
}
function draw(p,s){
 const f = renderers[p.diagram] || renderers.sss;
 return f(s,p.steps.length);
}
function drawSketch(p){
 const f = sketchRenderers[p.id] || sketchRenderers[p.diagram];
 if(f) return f();
 const finalStep = Math.max(0, p.steps.length - 1);
 return draw(p, finalStep);
}
const renderers={};
const sketchRenderers={};

function rightMark(p, size=18, cls="help", orient="ur"){
 const dirs={
  ur:[[0,0],[size,0],[size,-size],[0,-size]],
  ul:[[0,0],[-size,0],[-size,-size],[0,-size]],
  dr:[[0,0],[size,0],[size,size],[0,size]],
  dl:[[0,0],[-size,0],[-size,size],[0,size]]
 };
 const d=dirs[orient]||dirs.ur;
 const pts=d.map(([dx,dy])=>`${p.x+dx},${p.y+dy}`).join(" ");
 const col = cls==="final" ? "#137a43" : cls==="given" ? "#172033" : "#e99800";
 return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3"/>`;
}

 let q=[line(A,B,"final"),line(A,C,"final"),line(B,C,"final"),pt(A,"A"),pt(B,"B"),pt(C,"C")];
