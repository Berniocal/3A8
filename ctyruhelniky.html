function desktopTemplate(p){return `<div class="grid"><section class="card"><div class="eyebrow">${p.cat}</div><h1>${p.title}</h1><p class="lead">${p.find}</p><div class="badges">${p.tags.map(t=>`<span class="badge">${t}</span>`).join('')}</div><dl class="kv"><dt>Zadáno</dt><dd><b>${p.given}</b></dd><dt>Úkol</dt><dd>${p.find}</dd><dt>Varianty</dt><dd>${p.variants}</dd></dl><div class="notice"><b>Podmínka / počet řešení:</b><br>${p.existence}</div><div class="construction sketchbox"><h3>Náčrtek situace</h3><div class="sketch-preview">${drawSketch(p)}</div><p><b>Zeleně</b> známé údaje, <b>černě</b> neznámé části a <b>oranžově</b> pomocné prvky.</p></div><button id="solutionToggle" class="solution-toggle">${openSolution?'Skrýt řešení':'Rozbalit kompletní řešení'}</button><div class="solution ${openSolution?'open':''}"><div class="steps">${p.steps.map((s,i)=>`<div class="step ${i===stepIndex?'active':''}" data-step="${i}"><span class="num">${i+1}</span><strong>${s[0]}</strong><p>${s[1]}</p></div>`).join('')}</div><div class="construction"><h3>Zápis konstrukce</h3><ol>${p.construction.map(x=>`<li>${x}</li>`).join('')}</ol></div></div></section><section class="card diagram-card"><div class="diagram-head"><span class="diagram-title">Grafické řešení krok po kroku</span><span class="step-counter">Krok ${stepIndex+1} z ${p.steps.length}</span></div><div id="svgWrap">${draw(p,stepIndex)}</div><div class="diagram-controls"><button id="prevStep">← Krok zpět</button><button class="primary" id="nextStep">Další krok →</button></div><div class="legend"><span><i class="l-unknown"></i>základ / neznámé</span><span><i class="l-help"></i>pomocné</span><span><i class="l-known"></i>hotové</span></div></section></div>`}
function accordion(k,icon,title,body){const o=mobilePanels[k];return `<section class="mobile-accordion ${o?'open':''}"><button class="mobile-accordion-toggle" data-toggle="${k}"><span class="left"><span class="icon">${icon}</span><span>${title}</span></span><span class="chev">⌄</span></button><div class="mobile-accordion-panel">${body}</div></section>`}
function mobileTemplate(p){const sk=`<div>${drawSketch(p)}</div><p class="mobile-sketch-note"><b>Zeleně</b> známé údaje, <b>černě</b> neznámé části a <b>oranžově</b> pomocné prvky.</p>`;const st=`<div class="mobile-procedure-diagram"><div class="diagram-head"><b>Grafický krok</b><span class="step-counter">Krok ${stepIndex+1} z ${p.steps.length}</span></div>${draw(p,stepIndex)}<div class="diagram-controls"><button id="mPrevStep">← Krok zpět</button><button class="primary" id="mNextStep">Další krok →</button></div></div><div class="mobile-steps">${p.steps.map((s,i)=>`<div class="step ${i===stepIndex?'active':''}" data-mstep="${i}"><span class="num">${i+1}</span><strong>${s[0]}</strong><p>${s[1]}</p></div>`).join('')}</div>`;const co=`<div class="mobile-construction"><ol>${p.construction.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;return `<article class="mobile-detail-card"><div class="eyebrow">${p.cat}</div><h1>${p.title}</h1><p class="lead">${p.find}</p><div class="badges">${p.tags.map(t=>`<span class="badge">${t}</span>`).join('')}</div><div class="mobile-assignment"><div class="mobile-assignment-row"><span>Zadáno</span><b>${p.given}</b></div><div class="mobile-assignment-row"><span>Úkol</span><div>${p.find}</div></div><div class="mobile-assignment-row"><span>Varianty</span><div>${p.variants}</div></div></div><div class="notice"><b>Podmínka / počet řešení:</b><br>${p.existence}</div><div class="mobile-accordions">${accordion('sketch','▱','Náčrtek',sk)}${accordion('steps','1→','Postup krok po kroku',st)}${accordion('construction','✎','Zápis konstrukce',co)}</div></article>`}
function bindDesktop(p){$('#solutionToggle').onclick=()=>{openSolution=!openSolution;renderAll()};document.querySelectorAll('[data-step]').forEach(n=>n.onclick=()=>{stepIndex=+n.dataset.step;openSolution=true;renderAll()});$('#prevStep').onclick=()=>{stepIndex=Math.max(0,stepIndex-1);openSolution=true;renderAll()};$('#nextStep').onclick=()=>{stepIndex=Math.min(p.steps.length-1,stepIndex+1);openSolution=true;renderAll()}}
function bindMobile(p){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const k=b.dataset.toggle;mobilePanels[k]=!mobilePanels[k];renderAll()});document.querySelectorAll('[data-mstep]').forEach(n=>n.onclick=()=>{stepIndex=+n.dataset.mstep;mobilePanels.steps=true;renderAll()});const a=$('#mPrevStep'),b=$('#mNextStep');if(a)a.onclick=()=>{stepIndex=Math.max(0,stepIndex-1);mobilePanels.steps=true;renderAll()};if(b)b.onclick=()=>{stepIndex=Math.min(p.steps.length-1,stepIndex+1);mobilePanels.steps=true;renderAll()}}
function renderAll(){syncBody();renderList();const p=P[current];$('#progress').textContent=`${current+1} / ${P.length}`;if(isMobile()){if(!mobileDetail){$('#content').innerHTML='';return}$('#content').innerHTML=mobileTemplate(p);bindMobile(p);return}$('#content').innerHTML=desktopTemplate(p);bindDesktop(p)}
function move(d){current=(current+d+P.length)%P.length;stepIndex=0;openSolution=false;resetPanels();renderAll();scrollTo({top:0,behavior:'smooth'})}
$('#prevProblem').onclick=()=>move(-1);$('#nextProblem').onclick=()=>move(1);$('#mobileBackToList').onclick=()=>{mobileDetail=false;resetPanels();syncBody();renderAll();scrollTo({top:0,behavior:'smooth'})};$('#mobilePrevProblem').onclick=()=>move(-1);$('#mobileNextProblem').onclick=()=>move(1);$('#search').addEventListener('input',e=>{query=e.target.value;renderList()});addEventListener('resize',()=>{syncBody();renderAll()});renderFilters();renderAll();
</script></body></html>
